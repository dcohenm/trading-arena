name: Cartera mensual

on:
  schedule:
    - cron: "23 13 1 * *"          # día 1 de cada mes, 10:23 de Argentina
    - cron: "23 13 3 * *"          # respaldo el día 3 (no repite el aviso si ya salió)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cartera.py", ".github/workflows/cartera.yml"]

permissions:
  contents: write
  issues: write

concurrency:
  group: cartera
  cancel-in-progress: false

jobs:
  cartera:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt yfinance

      - name: Señal del mes (y aviso por mail)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python cartera.py signal

      - name: Actualizar el estudio histórico
        run: python cartera.py study

      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "arena-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in SENAL.md CARTERA.md study/cartera docs/cartera; do [ -e "$p" ] && git add -A "$p"; done
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -q -m "cartera: $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 10; done
          exit 1
