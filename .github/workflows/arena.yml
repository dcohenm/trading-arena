name: Arena

on:
  schedule:
    - cron: "17 * * * *"          # cada hora, al minuto 17
    - cron: "47 */2 * * *"        # respaldo cada 2 horas por si GitHub saltea alguna (correr dos veces no duplica nada)
  workflow_dispatch:               # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]
    paths: ["arena/**", "autopilot.py", "config.yaml", ".github/workflows/**"]

permissions:
  contents: write                  # para guardar el estado en el repositorio
  issues: write                    # para avisarte si un bot pasa todos los filtros

concurrency:
  group: arena
  cancel-in-progress: false        # nunca dos corridas a la vez

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt

      - name: Correr la arena
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}     # opcional: si existe, se suman los bots de Grok
          GH_TOKEN: ${{ github.token }}
        run: python autopilot.py tick

      - name: Guardar resultados
        run: |
          git config user.name "arena-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -q -m "arena: $(date -u '+%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
